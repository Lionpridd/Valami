<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ULTRA KAOSZ FITNESS</title>

<style>

body{
    margin:0;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

/* 🌈 DINAMIKUS HÁTTÉR */
body{
    background:#111;
    transition:background 0.2s;
}

/* ✨ MODERN FEJLÉC */
header{
    backdrop-filter: blur(12px);
    background:rgba(255,255,255,0.1);
    padding:20px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

nav a{
    margin:0 15px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    transition:0.3s;
}

nav a:hover{
    color:#00ffcc;
}

/* FŐ SZÖVEG */
.main{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    cursor:pointer;
    animation:glitch 0.1s infinite;
}

@keyframes glitch{
    0%{transform:translate(-50%,-50%) translate(0,0);}
    50%{transform:translate(-50%,-50%) translate(5px,-5px);}
    100%{transform:translate(-50%,-50%) translate(-5px,5px);}
}

/* DOBOZOK */
.box, .fuckyou{
    position:absolute;
    width:60px;
    height:60px;
    background:red;
    opacity:0.4;
    animation:move 1s infinite alternate;
}

.fuckyou{
    background:purple;
    animation:move 0.2s infinite alternate;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(300px,150px);}
}

/* FELUGRÓ SZÖVEG */
.popup{
    position:absolute;
    font-size:22px;
    color:#00ffcc;
    opacity:0;
    pointer-events:none;
    animation:fade 1s;
}

@keyframes fade{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
}

</style>
</head>

<body onclick="ultraChaos()">

<header>
<nav>
<a href="#">Minek?</a>
<a href="#">Étrendek</a>
<a href="#">Konditermek</a>
<a href="#">Előtte-utána képek</a>
<a href="#">Minden kérdésedre válasz</a>
</nav>
</header>

<div class="main" onclick="openVideo(event)">
Napi kalória kiszámítás fogyáshoz
</div>

<div class="box" style="top:10%; left:10%;"></div>
<div class="box" style="top:60%; left:30%;"></div>
<div class="fuckyou" style="top:30%; left:70%;"></div>

<audio id="music" loop>
<source src="metal.mp3" type="audio/mpeg">
</audio>

<script>

let attempts = 0;
let canClick = false;
let playing = false;

/* 🖱️ EGÉR + HÁTTÉR */
document.addEventListener("mousemove", function(e){

    // háttér színátmenet
    document.body.style.background =
        "radial-gradient(circle at " + e.clientX + "px " + e.clientY + "px, #00ffcc, #111)";

    if(canClick) return;

    let main = document.querySelector(".main");
    let rect = main.getBoundingClientRect();

    let distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if(distance < 150){
        attempts++;

        main.style.top = Math.random()*80 + "%";
        main.style.left = Math.random()*80 + "%";

        if(attempts >= 3){
            canClick = true;
            main.innerText = "Na jó... kattints 😄";
        }
    }
});

/* 🎵 ZENE */
function toggleMusic(){
    let music = document.getElementById("music");

    if(!playing){
        music.play();
        playing = true;
    }else{
        music.pause();
        playing = false;
    }
}

/* 🍔 VIDEÓ */
function openVideo(event){
    if(!canClick){
        event.preventDefault();
        return;
    }

    event.stopPropagation();
    window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ");
}

/* 🌍 RANDOM */
function randomRedirect(){
    let links = [
        "https://www.google.com/search?q=pizza",
        "https://www.google.com/search?q=hamburger"
    ];

    let random = links[Math.floor(Math.random()*links.length)];

    if(Math.random() < 0.4){
        setTimeout(()=>{ window.location.href = random; }, 1000);
    }
}

/* 💥 FELUGRÓ SZÖVEGEK */
function spawnPopup(){
    let texts = [
        "ne higgy nekünk!",
        "költsd el minden pénzed!",
        "fáj, mi?",
        "minek ez?",
        "nem kell?",
        "nem az én dolgom!"
    ];

    let popup = document.createElement("div");
    popup.className = "popup";

    popup.innerText = texts[Math.floor(Math.random()*texts.length)];

    popup.style.top = Math.random()*70 + "%";
    popup.style.left = Math.random()*80 + "%";

    document.body.appendChild(popup);

    setTimeout(()=>{ popup.remove(); }, 1000);
}

/* 💀 KÁOSZ */
function ultraChaos(){
    toggleMusic();
    randomRedirect();
}

/* ⏱️ AUTOMATA FELUGRÁS */
setInterval(spawnPopup, 2000);

</script>

</body>
</html>
