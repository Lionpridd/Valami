<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ULTRA KAOSZ FITNESS</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

/* FEJLÉC */
header{
    background:white;
    color:black;
    padding:15px;
    text-align:center;
}

nav a{
    margin:0 10px;
    text-decoration:none;
    color:black;
    font-weight:bold;
}

/* FŐ SZÖVEG */
.main{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    cursor:pointer;
    animation:glitch 0.1s infinite;
}

/* GLITCH */
@keyframes glitch{
    0%{transform:translate(-50%,-50%) translate(0,0);}
    50%{transform:translate(-50%,-50%) translate(5px,-5px);}
    100%{transform:translate(-50%,-50%) translate(-5px,5px);}
}

/* FLASH */
.flash{
    position:fixed;
    width:100%;
    height:100%;
    background:white;
    opacity:0;
}

/* DOBOZOK */
.box, .fuckyou{
    position:absolute;
    width:60px;
    height:60px;
    background:red;
    opacity:0.4;
    animation:move 1s infinite alternate;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(300px,150px);}
}

/* RANDOM SZÖVEG */
.randomText{
    position:absolute;
    font-size:20px;
    color:yellow;
}
</style>
</head>

<body onclick="ultraChaos()">

<header>
<nav>
<a href="#">Minek?</a>
<a href="#">Étrendek</a>
<a href="#">Konditermek</a>
<a href="#">Előtte-utána képek</a>
<a href="#">Minden kérdésedre válasz</a>
</nav>
</header>

<div class="main" onclick="openVideo(event)">
Napi kalória kiszámítás fogyáshoz
</div>

<div class="flash" id="flash"></div>

<div class="box" style="top:10%; left:10%;"></div>
<div class="box" style="top:60%; left:30%;"></div>

<div class="fuckyou" style="top:20%; left:20%;"></div>

<audio id="music" loop>
<source src="metal.mp3" type="audio/mpeg">
</audio>

<script>
let attempts = 0;
let canClick = false;
let playing = false;

document.addEventListener("mousemove", function(e){
    if(canClick) return;

    let main = document.querySelector(".main");
    let rect = main.getBoundingClientRect();

    let distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if(distance < 150){
        attempts++;

        main.style.top = Math.random()*80 + "%";
        main.style.left = Math.random()*80 + "%";

        if(attempts >= 3){
            canClick = true;
            main.innerText = "Na jó... kattints 😄";
        }
    }
});

// ZENE
function toggleMusic(){
    let music = document.getElementById("music");

    if(!playing){
        music.play();
        playing = true;
    }else{
        music.pause();
        playing = false;
    }
}

// VIDEÓ
function openVideo(event){
    if(!canClick){
        event.preventDefault();
        return;
    }

    event.stopPropagation();
    window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ");
}

// RANDOM
function randomRedirect(){
    let links = [
        "https://www.google.com/search?q=pizza",
        "https://www.google.com/search?q=hamburger"
    ];

    let random = links[Math.floor(Math.random()*links.length)];

    if(Math.random() < 0.4){
        setTimeout(()=>{ window.location.href = random; }, 1000);
    }
}

// FLASH
function flashEffect(){
    let flash = document.getElementById("flash");
    flash.style.opacity = 0.8;
    setTimeout(()=>{ flash.style.opacity = 0; }, 100);
}

// SZÖVEG
function spawnText(){
    let text = document.createElement("div");
    text.className = "randomText";

    let words = ["NE EDZ!", "PIZZA!", "NE FUSS!"];
    text.innerText = words[Math.floor(Math.random()*words.length)];

    text.style.top = Math.random()*100 + "%";
    text.style.left = Math.random()*100 + "%";

    document.body.appendChild(text);
    setTimeout(()=>{ text.remove(); }, 1000);
}

// KÁOSZ
function ultraChaos(){
    toggleMusic();
    randomRedirect();
    flashEffect();
    spawnText();
}
</script>

</body>
</html>
