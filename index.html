<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Kaotikus Fitness</title>

<style>

/* ALAP */
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

/* FEJLÉC */
header{
    background:white;
    color:black;
    padding:15px;
    text-align:center;
}

nav a{
    margin:0 15px;
    text-decoration:none;
    color:black;
    font-weight:bold;
}

/* FŐ SZÖVEG */
.main{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    cursor:pointer;
    animation:glitch 0.2s infinite;
}

/* GLITCH */
@keyframes glitch{
    0%{transform:translate(-50%,-50%) translate(0,0);}
    25%{transform:translate(-50%,-50%) translate(3px,-3px);}
    50%{transform:translate(-50%,-50%) translate(-3px,3px);}
    75%{transform:translate(-50%,-50%) translate(2px,2px);}
    100%{transform:translate(-50%,-50%) translate(0,0);}
}

/* RANDOM DOBOZOK */
.box{
    position:absolute;
    width:50px;
    height:50px;
    background:red;
    opacity:0.5;
    animation:move 3s infinite alternate;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(200px,100px);}
}

</style>
</head>

<body onclick="chaos()">

<header>
    <nav>
        <a href="#">Minek?</a>
        <a href="#">Étrendek</a>
        <a href="#">Konditermek</a>
        <a href="#">Előtte-utána képek</a>
    </nav>
</header>

<div class="main" onclick="openVideo(event)">
    Napi kalória kiszámítás fogyáshoz
</div>

<!-- RANDOM DOBOZOK -->
<div class="box" style="top:10%; left:10%;"></div>
<div class="box" style="top:70%; left:20%;"></div>
<div class="box" style="top:30%; left:80%;"></div>

<!-- ZENE -->
<audio id="music" loop>
    <source src="metal.mp3" type="audio/mpeg">
</audio>

<script>

let playing = false;

// 🎵 ZENE
function toggleMusic(){
    let music = document.getElementById("music");

    if(!playing){
        music.play();
        playing = true;
    }else{
        music.pause();
        playing = false;
    }
}

// 🍔 VIDEÓ
function openVideo(event){
    event.stopPropagation();
    window.open("https://www.youtube.com/watch?v=dQw4w9WgXcQ", "_blank");
}

// 🌍 RANDOM GOOGLE
function randomRedirect(){
    let links = [
          "https://www.google.com/search?q=legjobb+hamburger",
        "https://www.google.com/search?q=how+to+be+a+human&oq=how+to+be+a+human&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIHCAEQABiABDIHCAIQLhiABDIHCAMQABiABDIHCAQQABiABDIHCAUQABiABDIHCAYQABiABDIHCAcQABiABDIHCAgQABiABDIICAkQABgWGB4yCAgKEAAYFhgeMggICxAAGBYYHjIKCAwQABgKGBYYHjIICA0QABgWGB4yCAgOEAAYFhge0gEINDU3NGowajeoAhSwAgHxBWMvyqlUJbbS&client=tablet-android-weibu&sourceid=chrome-mobile&ie=UTF-8",
        "https://videa.hu/videok/film-animacio/al-arc-hd-akcio-thriller-film-animacio-Gu1OUvZiPYhSGFmj",
        "https://www.google.com/search?q=legfinomabb+pizza",
        "https://port.hu/adatlap/film/tv/az-elet-csodaszep-its-a-wonderful-life/movie-697"
    ];

    let random = links[Math.floor(Math.random()*links.length)];

    setTimeout(()=>{
        window.location.href = random;
    }, 800);
}

// 💥 KÁOSZ FUNKCIÓ
function chaos(){
    toggleMusic();
    randomRedirect();

    // random ugrás a szövegnek
    let main = document.querySelector(".main");
    main.style.top = Math.random()*90 + "%";
    main.style.left = Math.random()*90 + "%";
}

</script>

</body>
</html>
