<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ULTRA KAOSZ FITNESS</title>

<style>

/* (MINDEN EREDETI CSS MARAD) */

/* 💀 ÉLŐ ZSÍRLÉNY */
.creature{
    position:absolute;
    width:70px;
    height:70px;
    background:radial-gradient(circle, #ffb6a3, #ff7b7b);
    border-radius:50%;
    opacity:0.9;
    animation:
        move 3s infinite alternate,
        breathe 1.5s infinite,
        grow 0.5s ease-out;
}

/* 👀 SZEMEK */
.creature::before,
.creature::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    background:black;
    border-radius:50%;
    top:20px;
}

.creature::before{ left:18px; }
.creature::after{ right:18px; }

/* 🫁 LÉGZÉS */
@keyframes breathe{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

</style>
</head>

<body onclick="ultraChaos()">

<header>
<nav>
<a href="#">Minek?</a>
<a href="#">Étrendek</a>
<a href="#">Konditermek</a>
<a href="#">Előtte-utána képek</a>
<a href="#">Minden kérdésedre válasz</a>
</nav>
</header>

<div class="main" onclick="openVideo(event)">
Napi kalória kiszámítás fogyáshoz
</div>

<div class="box" style="top:10%; left:10%;"></div>
<div class="box" style="top:60%; left:30%;"></div>
<div class="fuckyou" style="top:30%; left:70%;"></div>

<audio id="music" loop>
<source src="metal.mp3" type="audio/mpeg">
</audio>

<script>

let attempts = 0;
let canClick = false;
let playing = false;

/* EGÉR + HÁTTÉR */
document.addEventListener("mousemove", function(e){

    document.body.style.background =
        "radial-gradient(circle at " + e.clientX + "px " + e.clientY + "px, #00ffcc, #111)";

    if(canClick) return;

    let main = document.querySelector(".main");
    let rect = main.getBoundingClientRect();

    let distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if(distance < 150){
        attempts++;

        main.style.top = Math.random()*80 + "%";
        main.style.left = Math.random()*80 + "%";

        if(attempts >= 3){
            canClick = true;
            main.innerText = "Máris 4000 kalóriát égettél, gratulálok, kattints";
        }
    }
});

/* ZENE */
function toggleMusic(){
    let music = document.getElementById("music");

    if(!playing){
        music.play();
        playing = true;
    }else{
        music.pause();
        playing = false;
    }
}

/* VIDEÓ */
function openVideo(event){
    if(!canClick){
        event.preventDefault();
        return;
    }

    event.stopPropagation();
    window.open("https://www.youtube.com/watch?v=TIfAkOBMf5A&list=RDTIfAkOBMf5A&start_radio=1");
}

/* RANDOM */
function randomRedirect(){
    let links = [
        "https://www.google.com/search?q=pizza",
        "https://www.google.com/search?q=hamburger",
        "https://hellomagyar.hu/2024/03/04/megdobbento-felfedezes-rakot-okozhat-a-fogyas/",
        "https://www.bing.com/search?q=how+to+be+a+human",
        "https://learnupnest.com/how-to-be-an-asshole/",
        "https://www.bing.com/search?q=technológiai+fejlődés"
    ];

    let random = links[Math.floor(Math.random()*links.length)];

    if(Math.random() < 0.4){
        setTimeout(()=>{ window.location.href = random; }, 1000);
    }
}

/* POPUP */
function spawnPopup(){
    let texts = [
        "ne higgy nekünk!",
        "költsd el minden pénzed!",
        "fáj, mi?",
        "minek ez?",
        "nem kell?",
        "nem az én dolgom!",
        "fáljon tovább",
        "csak azzal foglalkozom hogy ki mit csinál",
        "szeretem a zsíroskenyeret",
        "megeszem a világot",
        "gyökszikeh"
    ];

    let popup = document.createElement("div");
    popup.className = "popup";
    popup.innerText = texts[Math.floor(Math.random()*texts.length)];

    popup.style.top = Math.random()*70 + "%";
    popup.style.left = Math.random()*80 + "%";

    document.body.appendChild(popup);
    setTimeout(()=>{ popup.remove(); }, 1000);
}

/* DOBOZOK */
function spawnBoxes(){
    let box = document.createElement("div");
    box.className = Math.random() > 0.5 ? "box" : "fuckyou";

    box.style.top = (Math.random()*80 + 10) + "%";
    box.style.left = Math.random()*100 + "%";

    document.body.appendChild(box);
    setTimeout(()=>{ box.remove(); }, 4000);
}

/* 💀 ZSÍRLÉNYEK */
function spawnCreature(){
    let c = document.createElement("div");
    c.className = "creature";

    c.style.top = (Math.random()*80 + 10) + "%";
    c.style.left = Math.random()*100 + "%";

    document.body.appendChild(c);

    setInterval(()=>{
        c.style.transform =
            "translate(" + (Math.random()*20-10) + "px," + (Math.random()*20-10) + "px)";
    }, 500);

    setTimeout(()=>{
        c.remove();
    }, 6000);
}

/* KÁOSZ */
function ultraChaos(){
    toggleMusic();
    randomRedirect();
}

/* LOOP */
setInterval(spawnPopup, 2000);
setInterval(spawnBoxes, 300);
setInterval(spawnCreature, 800);

</script>

</body>
</html>
