<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>ULTRA KAOSZ FITNESS</title>

<style>

/* ALAP */
body{
    margin:0;
    color:white;
    font-family:Arial;
    overflow:hidden;
    background:#111;
    transition:background 0.2s;
}

/* FEJLÉC */
header{
    backdrop-filter: blur(12px);
    background:rgba(255,255,255,0.1);
    padding:20px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.2);
}

nav a{
    margin:0 15px;
    text-decoration:none;
    color:white;
    font-weight:bold;
}

/* FŐ SZÖVEG */
.main{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    cursor:pointer;
    animation:glitch 0.1s infinite;
}

@keyframes glitch{
    0%{transform:translate(-50%,-50%) translate(0,0);}
    50%{transform:translate(-50%,-50%) translate(5px,-5px);}
    100%{transform:translate(-50%,-50%) translate(-5px,5px);}
}

/* ZSÍR DOBOZOK */
.box, .fuckyou{
    position:absolute;
    width:60px;
    height:60px;
    background:radial-gradient(circle, #ffb6a3, #ff7b7b);
    opacity:0.85;
    border-radius:30%;
    animation:move 2s infinite alternate, grow 0.6s ease-out;
}

.fuckyou{
    background:radial-gradient(circle, #ff69b4, #8a2be2);
    animation:move 0.8s infinite alternate, grow 0.4s ease-out;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(300px,150px);}
}

@keyframes grow{
    0%{
        transform:scale(0);
        filter:blur(12px);
        opacity:0;
        border-radius:50%;
    }
    100%{
        transform:scale(1);
        filter:blur(0);
        opacity:0.85;
    }
}

/* 💀 ZSÍRLÉNY */
.creature{
    position:absolute;
    width:70px;
    height:70px;
    background:radial-gradient(circle, #ffd6a5, #ff7b7b);
    border-radius:50%;
    animation:blobMove 2s infinite alternate;
    box-shadow:0 0 20px rgba(255,120,120,0.7);
}

.creature::before, .creature::after{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    background:black;
    border-radius:50%;
    top:20px;
}

.creature::before{ left:18px; }
.creature::after{ right:18px; }

@keyframes blobMove{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(50px,30px) scale(1.2);}
}

/* POPUP */
.popup{
    position:absolute;
    font-size:22px;
    color:#00ffcc;
    opacity:0;
    animation:fade 1s;
}

@keyframes fade{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
}

</style>
</head>

<body onclick="ultraChaos()">

<header>
<nav>
<a href="#">Minek?</a>
<a href="#">Étrendek</a>
<a href="#">Konditermek</a>
<a href="#">Előtte-utána képek</a>
<a href="#">Minden kérdésedre válasz</a>
</nav>
</header>

<div class="main" onclick="openVideo(event)">
Napi kalória kiszámítás fogyáshoz
</div>

<audio id="music" loop>
<source src="metal.mp3" type="audio/mpeg">
</audio>

<script>

let attempts = 0;
let canClick = false;
let playing = false;

/* EGÉR */
document.addEventListener("mousemove", function(e){

    document.body.style.background =
        "radial-gradient(circle at " + e.clientX + "px " + e.clientY + "px, #00ffcc, #111)";

    if(canClick) return;

    let main = document.querySelector(".main");
    let rect = main.getBoundingClientRect();

    let distance = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if(distance < 150){
        attempts++;
        main.style.top = Math.random()*80 + "%";
        main.style.left = Math.random()*80 + "%";

        if(attempts >= 3){
            canClick = true;
            main.innerText = "Máris 4000 kalóriát égettél 😄 kattints";
        }
    }
});

/* ZENE */
function toggleMusic(){
    let music = document.getElementById("music");

    if(!playing){
        music.play();
        playing = true;
    }else{
        music.pause();
        playing = false;
    }
}

/* VIDEÓ */
function openVideo(event){
    if(!canClick){
        event.preventDefault();
        return;
    }
    event.stopPropagation();
    window.open(" window.open("https://www.youtube.com/watch?v=TIfAkOBMf5A&list=RDTIfAkOBMf5A&start_radio=1");");
}

/* RANDOM */
function randomRedirect(){
    let links = [
        "https://www.google.com/search?q=pizza",
        "https://www.google.com/search?q=hamburger",
        "https://www.google.com/search?q=legjobb+gyros",
        "https://hellomagyar.hu/2024/03/04/megdobbento-felfedezes-rakot-okozhat-a-fogyas/",
        "https://www.bing.com/search?q=how+to+be+a+human",
        "https://learnupnest.com/how-to-be-an-asshole/",
        "https://www.bing.com/search?q=technológiai+fejlődés"
    ];

    let random = links[Math.floor(Math.random()*links.length)];

    if(Math.random() < 0.4){
        setTimeout(()=>{ window.location.href = random; }, 1000);
    }
}

/* POPUP */
function spawnPopup(){
    let texts = ["ne higgy nekünk!", "költsd el minden pénzed!", "fáj, mi?", "minek ez?",
        "nem kell?",
        "nem az én dolgom!",
        "fáljon tovább",
        "csak azzal foglalkozom hogy ki mit csinál",
        "szeretem a zsíroskenyeret",
        "megeszem a világot",
        "gyökszikeh"];

    let popup = document.createElement("div");
    popup.className = "popup";
    popup.innerText = texts[Math.floor(Math.random()*texts.length)];

    popup.style.top = Math.random()*70 + "%";
    popup.style.left = Math.random()*80 + "%";

    document.body.appendChild(popup);
    setTimeout(()=>{ popup.remove(); }, 1000);
}

/* DOBOZ */
function spawnBoxes(){
    let box = document.createElement("div");
    box.className = Math.random() > 0.5 ? "box" : "fuckyou";
    box.style.top = (Math.random()*80 + 10) + "%";
    box.style.left = Math.random()*100 + "%";
    document.body.appendChild(box);
    setTimeout(()=>{ box.remove(); }, 4000);
}

/* 💀 ZSÍRLÉNY */
function spawnCreature(){
    let c = document.createElement("div");
    c.className = "creature";

    c.style.top = (Math.random()*80 + 10) + "%";
    c.style.left = Math.random()*100 + "%";

    document.body.appendChild(c);

    setTimeout(()=>{ c.remove(); }, 6000);
}

/* KÁOSZ */
function ultraChaos(){
    toggleMusic();
    randomRedirect();
}

/* LOOP */
setInterval(spawnPopup, 2000);
setInterval(spawnBoxes, 300);
setInterval(spawnCreature, 800);

</script>

</body>
</html>
